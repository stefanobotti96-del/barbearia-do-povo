const initial={open:true,services:[{id:1,name:'Corte masculino',price:45,duration:40,active:true},{id:2,name:'Barba',price:30,duration:30,active:true},{id:3,name:'Corte + barba',price:65,duration:60,active:true}],staff:[{id:1,name:'Lucas',commission:40,active:true,start:'09:00',end:'18:00',lunch:'13:00'},{id:2,name:'Rafael',commission:40,active:true,start:'09:00',end:'18:00',lunch:'13:00'}],bookings:[],messages:[],tips:[],reviews:[],expenses:[],products:[{id:1,name:'Pomada',price:45,stock:10}],sales:[],blocks:[],wait:[],clients:[{name:'Cliente teste'}],loyalty:{goal:10,reward:'Corte gratuito',cashback:5,plan:99,coupon:'POVO10',discount:10,birthday:10,referral:10},subscriptions:[],audit:[],cash:[],complaints:[],settings:{tips:true,reminder:true,backup:true,biometric:false},profile:'Cliente teste'};let s;try{s=JSON.parse(localStorage.getItem('bp-v1'))||structuredClone(initial)}catch(e){s=structuredClone(initial)}let page='Início',role='Cliente',barber=1;const $=id=>document.getElementById(id),v=id=>$(id).value,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now()+Math.random(),save=()=>localStorage.setItem('bp-v1',JSON.stringify(s)),log=x=>s.audit.unshift(new Date().toLocaleString()+' — '+x),msg=(text,target='Todos')=>s.messages.unshift({text,target}),go=p=>{page=p;render()},btn=(text,action)=>`<button onclick="${action}">${text}</button>`,field=(id,label,value='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`,sel=(id,label,items)=>`<label>${label}<select id="${id}">${items.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></label>`,card=x=>`<article>${x}</article>`,done=()=>s.bookings.filter(b=>b.status==='Concluído'),own=b=>role==='Administrador'||(role==='Barbeiro'?b.bid===barber:b.client===s.profile),sum=(a,k)=>a.reduce((n,x)=>n+Number(x[k]||0),0),revenue=()=>sum(done().filter(b=>b.paid),'price')+sum(s.sales,'price');function update(t){log(t);save();render()}function minutes(t){let [h,m]=t.split(':').map(Number);return h*60+m}function render(){let h=btn('← Início',"go('Início')")+`<h1>${page}</h1>`;if(page==='Início'){let menus=role==='Cliente'?['Agendar','Agenda','Serviços','Fidelidade','Produtos','Comunicados','Perfil']:role==='Barbeiro'?['Agenda','Agendar','Bloqueios','Financeiro','Gorjetas','Avaliações','Comunicados']:['Agenda','Agendar','Serviços','Funcionários','Bloqueios','Comunicados','Financeiro','Produtos','Fidelidade','Avaliações','Gorjetas','Relatórios','Segurança','Clientes'];h=`<h1>${role==='Administrador'?'Painel de gestão':'Bem-vindo!'}</h1>${card(s.open?'🟢 Aberta para atendimento':'🔴 Fechada temporariamente')}${role==='Barbeiro'?sel('who','Profissional',s.staff.filter(x=>x.active).map(x=>[x.id,x.name])):''}<div class="grid">${menus.map(x=>btn(x,`go('${x}')`)).join('')}</div>`}
if(page==='Agendar'){h+=s.open?card(sel('service','Serviço',s.services.filter(x=>x.active).map(x=>[x.id,x.name+' — '+money(x.price)]))+sel('staff','Barbeiro',s.staff.filter(x=>x.active).map(x=>[x.id,x.name]))+field('date','Data','','date')+field('time','Horário','09:00','time')+field('customer','Cliente',s.profile)+sel('pay','Pagamento',[['Presencial','Presencial'],['Pix','Pix simulado'],['Cartão','Cartão simulado']])+field('coupon','Cupom')+btn('Confirmar','book()')+btn('Lista de espera','waitlist()')):'Agenda fechada.'}
if(page==='Agenda'){h+=btn('Novo agendamento',"go('Agendar')")+s.bookings.filter(own).map(b=>card(`<b>${esc(b.service)} — ${money(b.price)}</b><p>${esc(b.client)} • ${esc(b.barber)}<br>${esc(b.date)} ${esc(b.time)} • ${b.status}<br>${b.paid?'Pago':'Pendente'} • ${esc(b.pay)}</p>`+(['Confirmado','Atrasado'].includes(b.status)?btn('Cancelar',`status(${b.id},'Cancelado')`)+btn('Reagendar',`reschedule(${b.id})`)+(role!=='Cliente'?btn('Concluir',`status(${b.id},'Concluído')`)+btn('Atraso',`status(${b.id},'Atrasado')`)+btn('Falta',`status(${b.id},'Faltou')`):''):'')+(role!=='Cliente'&&!b.paid?btn('Registrar pagamento',`paid(${b.id})`):'')+(role==='Cliente'&&b.status==='Concluído'?btn('Avaliar',`rate(${b.id})`)+(s.settings.tips?btn('Dar gorjeta',`tip(${b.id})`):''):''))).join('')+ '<h2>Lista de espera</h2>'+s.wait.filter(own).map(x=>card(esc(x.client)+' • '+esc(x.date))).join('')}
if(page==='Serviços')h+=(role==='Administrador'?btn('Novo serviço','editService(0)'):'')+s.services.filter(x=>role==='Administrador'||x.active).map(x=>card(`<b>${esc(x.name)}</b><p>${money(x.price)} • ${x.duration} min • ${x.active?'Ativo':'Inativo'}</p>${esc(x.desc||'')}`+(role==='Administrador'?btn('Editar',`editService(${x.id})`):btn('Agendar',"go('Agendar')")))).join('');
if(page==='Funcionários')h+=btn('Cadastrar','editStaff(0)')+s.staff.map(x=>card(`${esc(x.name)} • ${x.commission}% • ${x.active?'Ativo':'Desligado'}<p>${x.start}–${x.end}</p>`+btn('Editar',`editStaff(${x.id})`))).join('');
if(page==='Bloqueios')h+=card(sel('bs','Profissional',s.staff.filter(x=>role==='Administrador'||x.id===barber).map(x=>[x.id,x.name]))+field('bd','Data','','date')+field('be','Até','','date')+field('bt','Início','09:00','time')+field('bf','Fim','18:00','time')+field('br','Motivo','Folga')+btn('Bloquear','block()'))+s.blocks.filter(x=>role==='Administrador'||x.bid===barber).map(x=>card(`${esc(x.date)} ${esc(x.start)}–${esc(x.end)} ${esc(x.reason)}`+btn('Liberar',`unblock(${x.id})`))).join('');
if(page==='Comunicados')h+=(role==='Administrador'?card(btn('Abrir e avisar','opening(true)')+field('reason','Motivo')+btn('Fechar emergencialmente','opening(false)')+field('message','Comunicado')+sel('target','Destinatários',[['Todos','Todos'],['Cliente','Clientes'],['Barbeiro','Barbeiros']])+btn('Enviar simulação','send()')):'')+s.messages.filter(x=>role==='Administrador'||['Todos',role,role==='Cliente'?s.profile:String(barber)].includes(x.target)).map(x=>card(esc(x.text))).join('');
if(page==='Financeiro'){let d=done().filter(own),c=d.reduce((n,b)=>n+b.price*b.commission/100,0);h+=card(role==='Barbeiro'?`Comissões: <b>${money(c)}</b>`:`Receitas: <b>${money(revenue())}</b><p>Despesas: ${money(sum(s.expenses,'amount'))}<br>Comissões: ${money(c)}<br>Resultado: ${money(revenue()-c-sum(s.expenses,'amount'))}<br>Pendências: ${money(sum(s.bookings.filter(b=>!b.paid&&!['Cancelado','Faltou'].includes(b.status)),'price'))}</p>`)+(role==='Administrador'?card(field('expense','Despesa')+field('amount','Valor','','number')+btn('Registrar','expense()')+btn('Fechar caixa','closeCash()'))+s.expenses.map(x=>card(esc(x.name)+' '+money(x.amount))).join('')+s.cash.map(x=>card('Caixa '+esc(x.date)+' '+money(x.total))).join(''):'')}
if(page==='Produtos')h+=(role==='Administrador'?btn('Novo produto','editProduct(0)'):'')+s.products.map(x=>card(`${esc(x.name)} • ${money(x.price)}<p>Estoque: ${x.stock}</p>`+btn('Comprar / registrar venda',`sell(${x.id})`)+(role==='Administrador'?btn('Editar',`editProduct(${x.id})`):''))).join('');
if(page==='Fidelidade'){let l=s.loyalty;h+=role==='Administrador'?card(Object.entries(l).map(([k,x])=>field('l'+k,k,x,typeof x==='number'?'number':'text')).join('')+btn('Salvar','loyalty()')):card(`<b>${done().filter(own).length} / ${l.goal} visitas</b><p>Recompensa: ${esc(l.reward)}<br>Cashback estimado: ${money(sum(done().filter(own),'price')*l.cashback/100)}<br>Cupom ${esc(l.coupon)}: ${l.discount}%<br>Aniversário: ${l.birthday}% • Indicação: ${l.referral}%<br>Plano mensal: ${money(l.plan)}</p>`+btn('Assinar plano (teste)','subscribe()'))}
if(page==='Gorjetas')h+=card('Total: '+money(sum(s.tips.filter(own),'amount')))+s.tips.filter(own).map(x=>card(esc(x.name)+' • '+money(x.amount)+' • '+esc(x.pay))).join('');
if(page==='Avaliações')h+=s.reviews.filter(own).map(x=>card('★'.repeat(x.stars)+' '+esc(x.comment)+(role==='Administrador'?field('reply'+x.id,'Resposta',x.reply||'')+btn('Responder',`reply(${x.id})`):esc(x.reply||'')))).join('')+(role==='Administrador'?s.complaints.map(x=>card('Privado: '+esc(x))).join(''):'');
if(page==='Relatórios')h+=card(field('from','De','','date')+field('to','Até','','date')+sel('rb','Profissional',[[0,'Todos'],...s.staff.map(x=>[x.id,x.name])])+sel('rs','Serviço',[[0,'Todos'],...s.services.map(x=>[x.id,x.name])])+btn('Gerar relatório','report(false)')+btn('Exportar CSV para Excel','report(true)')+btn('Imprimir / salvar PDF','window.print()')+'<div id="result"></div>');
if(page==='Perfil')h+=card(field('name','Nome',s.profile)+btn('Salvar','profile()')+field('complaint','Reclamação privada')+btn('Enviar','complaint()')+btn('Recuperação de senha (simulação)',"alert('Nenhum e-mail real enviado')"));

function book(old){let a=s.services.find(x=>x.id===+v('service')),b=s.staff.find(x=>x.id===+v('staff')),date=v('date'),time=v('time'),client=v('customer').trim();if(!s.open||!a||!b||!date||!time||!client)return alert('Preencha os dados');let m=minutes(time),end=m+a.duration;if(m<minutes(b.start)||end>minutes(b.end)||m<minutes(b.lunch)+60&&end>minutes(b.lunch)||s.blocks.some(x=>x.bid===b.id&&date>=x.date&&date<=x.until&&m<minutes(x.end)&&end>minutes(x.start))||s.bookings.some(x=>x.id!==old&&x.bid===b.id&&x.date===date&&!['Cancelado','Faltou'].includes(x.status)&&m<minutes(x.time)+x.duration&&end>minutes(x.time)))return alert('Horário indisponível');let prev=s.bookings.find(x=>x.id===old),pay=v('pay');s.bookings=s.bookings.filter(x=>x.id!==old);s.bookings.push({id:old||uid(),sid:a.id,bid:b.id,service:a.name,barber:b.name,date,time,client,duration:a.duration,price:prev?.price??a.price*(v('coupon')===s.loyalty.coupon?1-s.loyalty.discount/100:1),commission:b.commission,pay,paid:pay!=='Presencial',status:'Confirmado'});if(!s.clients.some(x=>x.name===client))s.clients.push({name:client});msg('Novo agendamento: '+date+' '+time,String(b.id));page='Agenda';update('Reserva registrada')}
function reschedule(id){let b=s.bookings.find(x=>x.id===id);go('Agendar');if(!$('service'))return;$('service').value=b.sid;$('staff').value=b.bid;$('date').value=b.date;$('time').value=b.time;$('customer').value=b.client;$('pay').value=b.pay;let buttons=$('app').querySelectorAll('button');buttons[1].onclick=()=>book(id)}function waitlist(){if(!v('date'))return alert('Escolha data');s.wait.push({client:v('customer'),bid:+v('staff'),date:v('date')});update('Lista de espera');alert('Registrado')}
function status(id,t){let b=s.bookings.find(x=>x.id===id);b.status=t;if(t==='Cancelado')s.wait.filter(x=>x.date===b.date&&x.bid===b.bid).forEach(x=>msg('Horário liberado: '+b.time,x.client));update(t)}function paid(id){s.bookings.find(x=>x.id===id).paid=true;update('Pagamento registrado')}
function editor(title,html){$('app').innerHTML=btn('← Voltar',`go('${page}')`)+`<h1>${title}</h1>`+card(html)}function editService(id){let x=s.services.find(x=>x.id===id)||{name:'',price:0,duration:30,active:true};editor('Serviço',field('n','Nome',x.name)+field('p','Preço',x.price,'number')+field('d','Duração',x.duration,'number')+field('desc','Descrição',x.desc)+sel('active','Status',[[1,'Ativo'],[0,'Inativo']])+btn('Salvar',`saveService(${id})`));$('active').value=+x.active}function saveService(id){if(!v('n')||+v('p')<0||+v('d')<=0)return alert('Dados inválidos');s.services=s.services.filter(x=>x.id!==id);s.services.push({id:id||uid(),name:v('n'),price:+v('p'),duration:+v('d'),desc:v('desc'),active:v('active')==='1'});update('Serviço alterado')}
function editStaff(id){let x=s.staff.find(x=>x.id===id)||{name:'',commission:40,start:'09:00',end:'18:00',lunch:'13:00',active:true};editor('Profissional',field('n','Nome',x.name)+field('c','Comissão %',x.commission,'number')+field('start','Início',x.start,'time')+field('end','Fim',x.end,'time')+field('lunch','Almoço',x.lunch,'time')+field('goal','Meta',x.goal||0,'number')+sel('active','Status',[[1,'Ativo'],[0,'Desligado']])+btn('Salvar',`saveStaff(${id})`));$('active').value=+x.active}function saveStaff(id){if(!v('n')||+v('c')<0||+v('c')>100||v('start')>=v('end'))return alert('Dados inválidos');s.staff=s.staff.filter(x=>x.id!==id);s.staff.push({id:id||uid(),name:v('n'),commission:+v('c'),start:v('start'),end:v('end'),lunch:v('lunch'),goal:+v('goal'),active:v('active')==='1'});update('Funcionário alterado')}
function block(){if(!v('bd')||v('bt')>=v('bf'))return alert('Dados inválidos');s.blocks.push({id:uid(),bid:+v('bs'),date:v('bd'),until:v('be')||v('bd'),start:v('bt'),end:v('bf'),reason:v('br')});update('Bloqueio registrado')}function unblock(id){s.blocks=s.blocks.filter(x=>x.id!==id);update('Bloqueio removido')}function opening(x){s.open=x;msg(x?'Estamos abertos!':'Fechamento emergencial: '+v('reason'));update('Status alterado')}function send(){if(v('message')){msg(v('message'),v('target'));update('Comunicado simulado')}}function expense(){if(+v('amount')>0){s.expenses.push({name:v('expense'),amount:+v('amount')});update('Despesa registrada')}}function closeCash(){s.cash.push({date:new Date().toLocaleDateString(),total:revenue()-sum(s.expenses,'amount')});update('Caixa demonstrativo fechado')}
function editProduct(id){let x=s.products.find(x=>x.id===id)||{name:'',price:0,stock:0};editor('Produto',field('n','Nome',x.name)+field('p','Preço',x.price,'number')+field('q','Estoque',x.stock,'number')+btn('Salvar',`saveProduct(${id})`))}function saveProduct(id){if(!v('n')||+v('p')<0||+v('q')<0)return;s.products=s.products.filter(x=>x.id!==id);s.products.push({id:id||uid(),name:v('n'),price:+v('p'),stock:Math.floor(+v('q'))});update('Produto salvo')}function sell(id){let x=s.products.find(x=>x.id===id);if(x.stock<=0)return alert('Sem estoque');x.stock--;s.sales.push({name:x.name,price:x.price});update('Venda simulada')}function loyalty(){Object.keys(s.loyalty).forEach(k=>s.loyalty[k]=typeof s.loyalty[k]==='number'?+v('l'+k):v('l'+k));update('Fidelidade atualizada')}function subscribe(){if(!s.subscriptions.includes(s.profile))s.subscriptions.push(s.profile);update('Assinatura simulada');alert('Plano simulado')}
function rate(id){editor('Avaliar atendimento',sel('stars','Nota',[5,4,3,2,1].map(x=>[x,x+' estrelas']))+field('comment','Comentário')+btn('Enviar',`saveRate(${id})`))}function saveRate(id){let b=s.bookings.find(x=>x.id===id);s.reviews=s.reviews.filter(x=>x.booking!==id);s.reviews.push({id:uid(),booking:id,bid:b.bid,client:b.client,stars:+v('stars'),comment:v('comment')});if(+v('stars')<=2)log('Alerta de avaliação negativa');update('Avaliação registrada')}function reply(id){s.reviews.find(x=>x.id===id).reply=v('reply'+id);update('Resposta registrada')}function tip(id){editor('Gorjeta voluntária',field('amount','Valor R$',10,'number')+sel('pay','Pagamento',[['Pix','Pix'],['Cartão','Cartão']])+sel('anon','Identificação',[[0,'Identificado'],[1,'Anônimo']])+btn('Enviar gorjeta simulada',`saveTip(${id})`))}function saveTip(id){let b=s.bookings.find(x=>x.id===id),amount=+v('amount');if(amount<=0)return alert('Valor inválido');s.tips.push({bid:b.bid,client:b.client,name:v('anon')==='1'?'Anônimo':b.client,amount,pay:v('pay')});msg('Gorjeta recebida: '+money(amount),String(b.bid));update('Gorjeta simulada')}
function profile(){if(v('name').trim()){let old=s.profile;s.profile=v('name');s.bookings.filter(x=>x.client===old).forEach(x=>x.client=s.profile);if(!s.clients.some(x=>x.name===s.profile))s.clients.push({name:s.profile});update('Perfil salvo')}}function complaint(){if(v('complaint')){s.complaints.push(v('complaint'));update('Reclamação registrada')}}function settings(){Object.keys(s.settings).forEach(k=>s.settings[k]=$('set'+k).checked);update('Configurações salvas')}function reset(){if(confirm('Apagar todos os testes deste aparelho?')){s=structuredClone(initial);save();go('Início')}}function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function report(exporting){let rows=s.bookings.filter(x=>(!v('from')||x.date>=v('from'))&&(!v('to')||x.date<=v('to'))&&(!+v('rb')||x.bid===+v('rb'))&&(!+v('rs')||x.sid===+v('rs')));$('result').innerHTML=`<p>${rows.length} reservas • Recebido: ${money(sum(rows.filter(x=>x.paid&&x.status==='Concluído'),'price'))}</p>`+rows.map(x=>card(esc(x.date+' '+x.service+' '+x.client)+' '+money(x.price))).join('');if(exporting)download('\ufeffData;Cliente;Serviço;Valor;Status\n'+rows.map(x=>[x.date,x.client,x.service,x.price,x.status].map(y=>'"'+String(y).replaceAll('"','""')+'"').join(';')).join('\n'),'relatorio.csv','text/csv')}$('role').onchange=()=>{role=v('role');go('Início')};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
